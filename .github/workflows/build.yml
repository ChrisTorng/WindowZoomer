name: Build Windows EXE

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Stage executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\windowzoomer.exe dist\WindowZoomer.exe

      - name: Upload WindowZoomer
        uses: actions/upload-artifact@v4
        with:
          name: WindowZoomer-windows-x64
          path: dist/WindowZoomer.exe
          if-no-files-found: error

      - name: Publish v0.1.0 Windows release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-release]') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'dist/WindowZoomer-v0.1.0-win-x64.zip'
          Compress-Archive -Path 'dist/WindowZoomer.exe' -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  WindowZoomer-v0.1.0-win-x64.zip" | Set-Content 'dist/SHA256SUMS.txt' -Encoding ascii
          gh release view v0.1.0 *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.1.0 --target $env:GITHUB_SHA --title 'WindowZoomer v0.1.0' --notes 'Windows x64 magnifier. Portable, unsigned executable; see README for Windows Graphics Capture requirements.'
          }
          gh release upload v0.1.0 $zip 'dist/SHA256SUMS.txt' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
