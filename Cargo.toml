[package]
name = "windowzoomer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A fast Windows foreground-window magnifier using Windows Graphics Capture."

[dependencies]
windows-capture = "2.0.1"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging"
] }
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
